<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100 rounded-full blur-3xl opacity-40"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-40"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-blue-100 border border-slate-200 p-8 relative z-10">
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-100 mb-4">
                <i data-lucide="shield-check" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-900">Welcome back</h2>
            <p class="text-slate-500 mt-2 font-medium">Please enter your details to login.</p>
        </div>

        <form method="post" action="{% url 'login' %}" class="space-y-5">{% csrf_token %}
            {% if form.non_field_errors %}
                <div class="p-4 rounded-2xl bg-red-50 border border-red-200 text-red-700 text-sm font-medium">
                    {{ form.non_field_errors }}
                </div>
            {% endif %}

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Username or Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input name="username" type="text" value="{{ form.username.value|default:'' }}" class="w-full bg-white border border-slate-300 rounded-2xl py-3 pl-12 pr-4 text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="username or email" required>
                </div>
                {% if form.username.errors %}<p class="text-red-600 text-xs mt-2 font-medium">{{ form.username.errors|striptags }}</p>{% endif %}
            </div>

            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 w-5 h-5"></i>
                    <input name="password" type="password" class="w-full bg-white border border-slate-300 rounded-2xl py-3 pl-12 pr-4 text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition" placeholder="••••••••" required>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" name="remember_me" class="rounded border-slate-300 bg-white text-blue-600 focus:ring-blue-500">
                    <span class="text-slate-700 font-medium">Remember me</span>
                </label>
                <a href="{% url 'password_reset' %}" class="text-blue-600 hover:text-blue-700 font-semibold transition">Forgot password?</a>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-blue-200 transition-all transform active:scale-95 flex justify-center items-center gap-2 duration-200">
                <span>Sign In</span>
            </button>
        </form>

        <div class="relative my-8">
            <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200"></div></div>
            <div class="relative flex justify-center text-xs uppercase tracking-widest"><span class="px-3 bg-white text-slate-500 font-semibold">Fast Access</span></div>
        </div>

        <button class="w-full bg-slate-100 hover:bg-slate-200 text-slate-900 py-3 rounded-2xl font-bold flex items-center justify-center gap-3 transition-colors duration-200">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            Continue with Google
        </button>

        <p class="text-center text-sm mt-8 text-slate-600">
            Don't have an account? <a href="{% url 'register' %}" class="text-blue-600 hover:text-blue-700 font-bold transition">Create an account</a>
        </p>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
