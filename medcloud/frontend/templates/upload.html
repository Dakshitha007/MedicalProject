<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-[#0f172a] text-white p-10">
    <div class="max-w-2xl mx-auto">
        <h2 class="text-2xl font-bold mb-6 flex items-center gap-2">
            <i data-lucide="shield-check" class="text-green-400"></i> Secure Report Upload
        </h2>
        
        <div class="border-2 border-dashed border-slate-700 rounded-3xl p-12 text-center bg-[#1e293b] hover:border-blue-500 transition cursor-pointer">
            <i data-lucide="upload-cloud" class="w-12 h-12 mx-auto text-slate-500 mb-4"></i>
            <p class="text-lg">Drag and drop medical PDF or Images</p>
            <p class="text-sm text-slate-500 mt-2">Files are encrypted with AES-256 before storage</p>
            <input type="file" class="hidden" id="fileInput">
            <button onclick="document.getElementById('fileInput').click()" class="mt-6 bg-blue-600 px-6 py-2 rounded-full font-bold">Select File</button>
        </div>

        <div class="mt-10 bg-[#1e293b] rounded-2xl p-6 border border-slate-700">
            <h3 class="text-sm font-bold text-slate-400 uppercase mb-4">Recent Scanned Files</h3>
            <div class="flex items-center justify-between p-3 hover:bg-slate-800 rounded-lg">
                <div class="flex items-center gap-3">
                    <i data-lucide="file-text" class="text-blue-400"></i>
                    <span>Blood_Test_May.pdf</span>
                </div>
                <button class="text-blue-400 text-sm font-semibold">Download</button>
            </div>
        </div>
    </div>
    <script>lucide.createIcons();</script>
</body>
</html>
