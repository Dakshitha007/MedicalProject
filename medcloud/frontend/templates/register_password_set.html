<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set Password - CLINIK</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-6 text-slate-200">
<div class="max-w-md w-full bg-slate-950/90 border border-slate-800 rounded-2xl p-8">
    <h1 class="text-2xl font-bold mb-4">Set your password</h1>
    <form id="passwordForm" class="space-y-4">
        <input name="email" id="email" type="email" placeholder="Email" required class="w-full p-3 rounded bg-slate-900/70 border border-slate-700" />
        <input name="password" id="password" type="password" placeholder="Password" required class="w-full p-3 rounded bg-slate-900/70 border border-slate-700" />
        <input name="password_confirm" id="password_confirm" type="password" placeholder="Confirm password" required class="w-full p-3 rounded bg-slate-900/70 border border-slate-700" />
        <ul id="passwordRules" class="mt-3 space-y-2 text-sm text-red-400" aria-live="polite">
            <li data-rule="length">• Minimum 8 characters</li>
            <li data-rule="uppercase">• At least one uppercase letter</li>
            <li data-rule="lowercase">• At least one lowercase letter</li>
            <li data-rule="number">• At least one number</li>
            <li data-rule="special">• At least one special character</li>
        </ul>
        <button type="submit" class="w-full py-3 rounded bg-gradient-to-r from-blue-500 to-cyan-500">Set Password & Sign In</button>
    </form>
    <div id="message" class="mt-4 text-sm text-amber-300"></div>
</div>
<script>
const API = '/api/auth';
const form = document.getElementById('passwordForm');
const message = document.getElementById('message');
const password = document.getElementById('password');
const confirm = document.getElementById('password_confirm');
const rules = document.getElementById('passwordRules');
const emailInput = document.getElementById('email');

const validators = {
    length: v => v.length >= 8,
    uppercase: v => /[A-Z]/.test(v),
    lowercase: v => /[a-z]/.test(v),
    number: v => /[0-9]/.test(v),
    special: v => /[!@#$%^&*(),.?:;{}|<>]/.test(v)
};

function updateRules(){
    const v = password.value;
    Object.entries(validators).forEach(([k, fn])=>{
        const node = rules.querySelector(`[data-rule="${k}"]`);
        if(fn(v)) { node.classList.remove('text-red-400'); node.classList.add('text-emerald-400'); } else { node.classList.remove('text-emerald-400'); node.classList.add('text-red-400'); }
    });
}

password.addEventListener('input', updateRules);

form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = { email: emailInput.value, password: password.value, password_confirm: confirm.value };
    try{
        const res = await fetch(API + '/register/password/', {
            method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if(res.ok){
            // tokens returned
            localStorage.setItem('access_token', json.access);
            localStorage.setItem('refresh_token', json.refresh);
            // Redirect based on role returned by server (case-insensitive)
            const role = (json.role || 'PATIENT').toString().toLowerCase();
            if(role === 'doctor' || role === 'DOCTOR') {
                window.location.replace('/dashboard/doctor/');
            } else {
                window.location.replace('/dashboard/patient/');
            }
        } else {
            message.innerText = json.detail || JSON.stringify(json);
        }
    }catch(err){
        message.innerText = 'Unable to contact server.';
    }
});

function getCookie(name) {let cookieValue = null; if (document.cookie && document.cookie !== '') {const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) {const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) {cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break;}}} return cookieValue;}

// prefill email from query param
const params = new URLSearchParams(window.location.search);
if(params.get('email')) emailInput.value = params.get('email');
</script>
</body>
</html>
