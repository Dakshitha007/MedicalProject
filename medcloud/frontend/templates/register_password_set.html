<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Set Password - DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="mx-auto flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-md rounded-[32px] bg-white p-10 shadow-xl shadow-slate-200/70">
            <div class="mb-6">
                <p class="text-xs uppercase tracking-[0.3em] text-blue-600">Password setup</p>
                <h1 class="mt-3 text-3xl font-semibold text-slate-950">Secure your DiagoVault AI account</h1>
                <p class="mt-3 text-slate-600">Set a password to complete registration and sign in securely.</p>
            </div>
            <form id="passwordForm" class="space-y-4">
                <input name="email" id="email" type="email" placeholder="Email" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="password" id="password" type="password" placeholder="Password" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="password_confirm" id="password_confirm" type="password" placeholder="Confirm password" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <ul id="passwordRules" class="mt-3 space-y-2 text-sm text-red-500" aria-live="polite">
                    <li data-rule="length">• Minimum 8 characters</li>
                    <li data-rule="uppercase">• At least one uppercase letter</li>
                    <li data-rule="lowercase">• At least one lowercase letter</li>
                    <li data-rule="number">• At least one number</li>
                    <li data-rule="special">• At least one special character</li>
                </ul>
                <button type="submit" class="w-full rounded-3xl bg-blue-600 py-4 text-base font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-700">Set Password & Sign In</button>
            </form>
            <div id="message" class="mt-4 text-sm text-slate-600"></div>
        </div>
    </div>
    <script>
const API = '/api/auth';
const form = document.getElementById('passwordForm');
const message = document.getElementById('message');
const password = document.getElementById('password');
const confirm = document.getElementById('password_confirm');
const rules = document.getElementById('passwordRules');
const emailInput = document.getElementById('email');
const validators = {
    length: v => v.length >= 8,
    uppercase: v => /[A-Z]/.test(v),
    lowercase: v => /[a-z]/.test(v),
    number: v => /[0-9]/.test(v),
    special: v => /[!@#$%^&*(),.?:;{}|<>]/.test(v)
};
function updateRules(){
    const v = password.value;
    Object.entries(validators).forEach(([k, fn])=>{
        const node = rules.querySelector(`[data-rule="${k}"]`);
        if(node) {
            if(fn(v)) { node.classList.remove('text-red-500'); node.classList.add('text-emerald-500'); }
            else { node.classList.remove('text-emerald-500'); node.classList.add('text-red-500'); }
        }
    });
}
password.addEventListener('input', updateRules);
form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = { email: emailInput.value, password: password.value, password_confirm: confirm.value };
    try{
        const res = await fetch(API + '/register/password/', {
            method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if(res.ok){
            localStorage.setItem('access_token', json.access);
            localStorage.setItem('refresh_token', json.refresh);
            if (json.role) { localStorage.setItem('user_role', json.role); }
            if (json.user && json.user.id) { localStorage.setItem('user_id', json.user.id); }
            if (emailInput.value) { localStorage.setItem('user_email', emailInput.value.toLowerCase()); }
            const role = (json.role || 'PATIENT').toString().toLowerCase();
            if(role === 'doctor' || role === 'DOCTOR') { window.location.replace('/dashboard/doctor/'); } else { window.location.replace('/dashboard/patient/'); }
        } else {
            message.innerText = json.detail || JSON.stringify(json);
        }
    }catch(err){
        message.innerText = 'Unable to contact server.';
    }
});
function getCookie(name) {let cookieValue = null; if (document.cookie && document.cookie !== '') {const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) {const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) {cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break;}}} return cookieValue;}
const params = new URLSearchParams(window.location.search);
if(params.get('email')) emailInput.value = params.get('email');
    </script>
</body>
</html>
