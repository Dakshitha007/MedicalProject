<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset | DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100 rounded-full blur-3xl opacity-40"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-40"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-blue-100 border border-slate-200 p-8 relative z-10">
        <div class="mb-8 text-center">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-blue-100 mb-4">
                <i data-lucide="key" class="w-8 h-8 text-blue-600"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-900">Reset Password</h2>
            <p class="text-slate-500 mt-2 font-medium">Enter your email address to receive a password reset link</p>
        </div>

        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Email Address</label>
                {{ form.email }}
                {% if form.email.errors %}<p class="text-red-600 text-xs mt-2 font-medium">{{ form.email.errors|striptags }}</p>{% endif %}
            </div>

            <style>
                input[type="email"] {
                    @apply w-full bg-white border border-slate-300 rounded-2xl py-3 px-4 text-slate-900 focus:border-blue-500 focus:ring-2 focus:ring-blue-100 outline-none transition;
                }
            </style>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-2xl shadow-lg shadow-blue-200 transition-all transform active:scale-95 duration-200">
                Send Reset Link
            </button>
        </form>

        <p class="text-center text-sm mt-8 text-slate-600">
            Remember your password? <a href="{% url 'login' %}" class="text-blue-600 hover:text-blue-700 font-bold transition">Sign In</a>
        </p>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
