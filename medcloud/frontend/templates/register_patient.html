<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Patient Registration - DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="mx-auto flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-3xl rounded-[32px] bg-white p-10 shadow-xl shadow-slate-200/70">
            <div class="mb-8 flex items-center justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-blue-600">Patient registration</p>
                    <h1 class="mt-3 text-3xl font-semibold text-slate-950">Create your DiagoVault AI account</h1>
                </div>
                <a href="/register/" class="text-sm font-semibold text-blue-600 hover:text-blue-800">Choose another path</a>
            </div>
            <form id="patientForm" class="space-y-5">
                <div class="grid gap-4 sm:grid-cols-2">
                    <input name="full_name" placeholder="Full name" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                    <input name="email" type="email" placeholder="Email" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                </div>
                <div class="grid gap-4 sm:grid-cols-3">
                    <input name="age" type="number" placeholder="Age" required class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                    <select name="gender" required class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200">
                        <option value="">Gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>
                    </select>
                    <input name="phone_number" placeholder="Phone" required class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                </div>
                <div class="grid gap-4 sm:grid-cols-2">
                    <input name="address" placeholder="Address" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                    <input name="emergency_contact" placeholder="Emergency contact" class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                </div>
                <button type="submit" class="w-full rounded-3xl bg-blue-600 py-4 text-base font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-700">Start Registration</button>
            </form>
            <p id="message" class="mt-4 text-sm text-slate-600"></p>
        </div>
    </div>
    <script>
const API = '/api/auth';
const form = document.getElementById('patientForm');
const message = document.getElementById('message');
form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try{
        const res = await fetch(API + '/register/patient/', {
            method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if(res.ok){
            const patientId = json.patient_id;
            let successMessage = json.detail || 'OTP sent. Redirecting to verification.';
            if (patientId) {
                successMessage += ' Your patient ID is ' + patientId + '.';
            }
            message.innerText = successMessage;
            const email = data.email ? encodeURIComponent(data.email) : '';
            const params = new URLSearchParams();
            if (email) params.set('email', email);
            if (patientId) params.set('patient_id', patientId);
            setTimeout(()=> window.location.href = '/register/patient/verify/?' + params.toString(), 800);
        } else {
            message.innerText = json.detail || JSON.stringify(json);
        }
    }catch(err){
        message.innerText = 'Unable to contact server.';
    }
});
function getCookie(name) {let cookieValue = null; if (document.cookie && document.cookie !== '') {const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) {const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) {cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break;}}} return cookieValue;}
    </script>
</body>
</html>
