<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Verify OTP - DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="mx-auto flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-xl rounded-[32px] bg-white p-10 shadow-xl shadow-slate-200/70">
            <div class="mb-6">
                <p class="text-xs uppercase tracking-[0.3em] text-blue-600">Verify OTP</p>
                <h1 class="mt-3 text-3xl font-semibold text-slate-950">Confirm your doctor registration</h1>
                <p class="mt-3 text-slate-600">Enter the OTP sent to your email address.</p>
            </div>
            <form id="otpForm" autocomplete="off" class="space-y-4">
                <input name="email" type="email" autocomplete="email" autocapitalize="off" spellcheck="false" placeholder="Email used during registration" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="code" type="text" autocomplete="one-time-code" inputmode="numeric" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="OTP code" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <div class="flex gap-3">
                    <button type="submit" class="flex-1 rounded-3xl bg-blue-600 py-3 text-white transition hover:bg-blue-700">Verify OTP</button>
                    <button type="button" id="resendBtn" class="rounded-3xl border border-slate-200 bg-white py-3 text-slate-700 transition hover:bg-slate-50">Resend OTP</button>
                </div>
            </form>
            <div id="message" class="mt-4 text-sm text-slate-600"></div>
        </div>
    </div>
    <script>
const API = '/api/auth';
const form = document.getElementById('otpForm');
const message = document.getElementById('message');
fillEmailFromQuery();
form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try{
        const res = await fetch(API + '/register/doctor/verify-otp/', {
            method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify({...data, purpose: 'doctor_verification'})
        });
        const json = await res.json();
        if(res.ok){
            message.innerHTML = (json.detail || 'OTP verified. Complete your password setup to log in.') + '<br/><span class="text-slate-500">Redirecting to password setup...</span>';
            setTimeout(()=> window.location.replace('/register/password/?email=' + encodeURIComponent(data.email)), 500);
        } else {
            message.innerText = json.detail || JSON.stringify(json);
        }
    }catch(err){
        message.innerText = 'Unable to contact server.';
    }
});
const resendBtn = document.getElementById('resendBtn');
if (resendBtn) {
    resendBtn.addEventListener('click', async ()=>{
        const emailField = document.querySelector('input[name="email"]');
        const email = emailField ? emailField.value.trim() : '';
        if (!email) { message.innerText = 'Please provide the email used during registration.'; return; }
        resendBtn.disabled = true;
        try {
            const res = await fetch(API + '/resend-otp/', { method: 'POST', headers: {'Content-Type':'application/json','X-CSRFToken': getCookie('csrftoken')}, body: JSON.stringify({email: email, purpose: 'doctor_verification'}) });
            const json = await res.json();
            message.innerText = json.detail || 'OTP resent.';
            if (res.ok && json.debug_otp) { console.log('DEBUG OTP:', json.debug_otp); }
        } catch (err) {
            message.innerText = 'Unable to resend OTP.';
        }
        setTimeout(()=> resendBtn.disabled = false, 30000);
    });
}
function getCookie(name) {let cookieValue = null; if (document.cookie && document.cookie !== '') {const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) {const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) {cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break;}}} return cookieValue;}
function fillEmailFromQuery() {
    const params = new URLSearchParams(window.location.search);
    const email = params.get('email');
    if (email) {
        const emailField = document.querySelector('input[name="email"]');
        if (emailField) { emailField.value = email; }
    }
}
    </script>
</body>
</html>
