<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Register - CLINIK</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] min-h-screen flex items-center justify-center p-6 text-slate-200">
<div class="max-w-3xl w-full bg-slate-950/90 border border-slate-800 rounded-2xl p-10">
    <h1 class="text-3xl font-bold mb-4">Create an account</h1>
    <p class="text-slate-400 mb-6">Choose how you want to register.</p>
    <div class="grid grid-cols-2 gap-4">
        <a href="/register/patient/" class="p-6 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 hover:from-blue-600 hover:to-cyan-600 text-center">Patient<br><span class="text-sm text-slate-300">Personal account</span></a>
        <a href="/register/doctor/" class="p-6 rounded-xl bg-gradient-to-br from-slate-800 to-slate-900 hover:from-purple-600 hover:to-pink-600 text-center">Doctor<br><span class="text-sm text-slate-300">Professional account</span></a>
    </div>
    <p class="mt-6 text-sm text-slate-400">Or continue with Google (will ask for role on first login).</p>
</div>
</body>
</html>
