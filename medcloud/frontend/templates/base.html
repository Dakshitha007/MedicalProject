{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DiagoVault AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        lightBlue: '#e6f2ff',
                        brandText: '#0f172a'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="{% static 'frontend/css/diago.css' %}">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-white text-slate-900 min-h-screen antialiased">

    <header class="w-full border-b bg-white">
        <div class="mx-auto max-w-7xl px-6 py-4 flex items-center justify-between">
            <a href="/" class="flex items-center gap-3">
                <div class="h-10 w-10 flex items-center justify-center rounded-lg bg-primary text-white shadow-sm">
                    <i data-lucide="activity" class="w-5 h-5"></i>
                </div>
                <div>
                    <div class="text-lg font-semibold">DiagoVault AI</div>
                    <div class="text-xs text-slate-500">Intelligent Care, Secure Records</div>
                </div>
            </a>
            <nav class="flex items-center gap-3">
                <a href="/login/" class="text-sm font-medium text-slate-700">Login</a>
                <a href="/register/" class="ml-3 inline-flex items-center rounded-full bg-primary px-4 py-2 text-sm font-semibold text-white shadow">Sign Up</a>
            </nav>
        </div>
    </header>

    <main class="flex-1 p-8">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
