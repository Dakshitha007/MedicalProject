<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DiagoVault AI{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563EB',
                        primaryHover: '#1D4ED8',
                        lightBlue: '#EFF6FF',
                        background: '#F8FAFC',
                        cardBg: '#FFFFFF',
                        textPrimary: '#0F172A',
                        textSecondary: '#64748B',
                        borderColor: '#E2E8F0'
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
        body { @apply bg-background text-textPrimary; }
        .sidebar-link-active { @apply bg-primary text-white shadow-lg shadow-primary/10; }
        .sidebar-link { @apply text-textSecondary hover:text-textPrimary hover:bg-lightBlue; }
        .card-shadow { box-shadow: 0 10px 30px rgba(37, 99, 235, 0.08); }
    </style>
</head>
<body class="bg-background text-textPrimary min-h-screen flex">

    <aside class="w-64 bg-cardBg border-r border-borderColor flex flex-col justify-between p-6 shrink-0 h-screen sticky top-0">
        <div>
            <div class="flex items-center gap-3 mb-10 px-2">
                <div class="bg-primary p-2.5 rounded-2xl text-white card-shadow">
                    <i data-lucide="activity" class="w-6 h-6"></i>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-tight">DiagoVault AI</span>
                    <p class="text-xs text-textSecondary">Medical Records</p>
                </div>
            </div>

            <div class="space-y-6">
                <div>
                    <span class="text-xs font-semibold text-textSecondary tracking-wider uppercase block mb-3 px-2">Main Menu</span>
                    <nav class="space-y-1">
                        <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all {% if request.resolver_match.url_name == 'dashboard' %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                            <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                        </a>
                        <a href="{% url 'reports' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all {% if request.resolver_match.url_name == 'reports' %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                            <i data-lucide="file-text" class="w-5 h-5"></i> Medical Reports
                        </a>
                        <a href="{% url 'upload' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all {% if request.resolver_match.url_name == 'upload' %}sidebar-link-active{% else %}sidebar-link{% endif %}">
                            <i data-lucide="cloud-upload" class="w-5 h-5"></i> Upload Records
                        </a>
                        <a href="#appointments-section" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all sidebar-link">
                            <i data-lucide="calendar" class="w-5 h-5"></i> Appointments
                        </a>
                    </nav>
                </div>

                <div>
                    <span class="text-xs font-semibold text-textSecondary tracking-wider uppercase block mb-3 px-2">Account</span>
                    <nav class="space-y-1">
                        <a href="{% url 'setting' %}" class="flex items-center gap-3 px-4 py-3 rounded-xl font-medium transition-all sidebar-link">
                            <i data-lucide="settings" class="w-5 h-5"></i> Settings
                        </a>
                    </nav>
                </div>
            </div>
        </div>

        <a href="{% url 'logout' %}" class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-medium transition-all">
            <i data-lucide="log-out" class="w-5 h-5"></i> Sign Out
        </a>
    </aside>

    <main class="flex-1 p-8 overflow-y-auto bg-gradient-to-br from-background via-white to-lightBlue/30">
        {% block content %}
        {% endblock %}
    </main>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
