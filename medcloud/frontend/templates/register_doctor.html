<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Doctor Registration - DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div class="mx-auto flex min-h-screen items-center justify-center px-6 py-12">
        <div class="w-full max-w-3xl rounded-[32px] bg-white p-10 shadow-xl shadow-slate-200/70">
            <div class="mb-8 flex items-center justify-between gap-4">
                <div>
                    <p class="text-xs uppercase tracking-[0.3em] text-blue-600">Doctor registration</p>
                    <h1 class="mt-3 text-3xl font-semibold text-slate-950">Apply for clinical access</h1>
                </div>
                <a href="/register/" class="text-sm font-semibold text-blue-600 hover:text-blue-800">Choose another path</a>
            </div>
            <form id="doctorForm" class="space-y-5">
                <input name="full_name" placeholder="Full name" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="hospital_name" placeholder="Hospital name" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="specialization" placeholder="Specialization" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <input name="medical_license_number" placeholder="Medical license number" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <div class="grid gap-4 sm:grid-cols-2">
                    <input name="years_of_experience" type="number" placeholder="Years of experience" required class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                    <input name="phone_number" placeholder="Phone" required class="rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                </div>
                <input name="email" type="email" placeholder="Official hospital email" required class="w-full rounded-3xl border border-slate-200 bg-slate-50 px-4 py-3 text-slate-900 outline-none focus:border-blue-400 focus:ring-2 focus:ring-blue-200" />
                <button type="submit" class="w-full rounded-3xl bg-blue-600 py-4 text-base font-semibold text-white shadow-lg shadow-blue-500/20 transition hover:bg-blue-700">Submit for approval</button>
            </form>
            <p id="message" class="mt-4 text-sm text-slate-600"></p>
        </div>
    </div>
    <script>
const API = '/api/auth';
const form = document.getElementById('doctorForm');
const message = document.getElementById('message');
form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const data = Object.fromEntries(new FormData(form).entries());
    try{
        const res = await fetch(API + '/register/doctor/', {
            method: 'POST', headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
            body: JSON.stringify(data)
        });
        const json = await res.json();
        if(res.ok){
            const successMessage = json.detail || 'OTP sent. Redirecting to verification.';
            message.innerText = successMessage;
            const email = data.email ? encodeURIComponent(data.email) : '';
            setTimeout(()=> window.location.href = '/register/doctor/verify/' + (email ? '?email=' + email : ''), 800);
        } else {
            message.innerText = json.detail || JSON.stringify(json);
        }
    }catch(err){
        message.innerText = 'Unable to contact server.';
    }
});
function getCookie(name) {let cookieValue = null; if (document.cookie && document.cookie !== '') {const cookies = document.cookie.split(';'); for (let i = 0; i < cookies.length; i++) {const cookie = cookies[i].trim(); if (cookie.substring(0, name.length + 1) === (name + '=')) {cookieValue = decodeURIComponent(cookie.substring(name.length + 1)); break;}}} return cookieValue;}
    </script>
</body>
</html>
