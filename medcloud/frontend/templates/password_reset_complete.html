<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Complete | DiagoVault AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        * { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-blue-50 min-h-screen flex items-center justify-center p-4">

    <div class="absolute top-20 left-20 w-72 h-72 bg-blue-100 rounded-full blur-3xl opacity-40"></div>
    <div class="absolute bottom-20 right-20 w-96 h-96 bg-blue-100 rounded-full blur-3xl opacity-40"></div>

    <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl shadow-blue-100 border border-slate-200 p-8 relative z-10 text-center">
        <div class="mb-6">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-green-100 mb-4">
                <i data-lucide="check-circle" class="w-8 h-8 text-green-600"></i>
            </div>
            <h2 class="text-3xl font-bold text-slate-900">Password Reset Complete</h2>
            <p class="text-slate-500 mt-3 font-medium">Your password has been successfully updated. You can now log in with your new password.</p>
        </div>

        <div class="p-4 rounded-2xl bg-green-50 border border-green-200 mb-6">
            <p class="text-sm text-green-700 font-medium">Your account is now secure with your new password.</p>
        </div>

        <a href="{% url 'login' %}" class="inline-block bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-2xl font-semibold shadow-lg shadow-blue-200 transition">
            Sign In Now
        </a>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
